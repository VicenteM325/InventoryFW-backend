name: CI/CD Backend

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

# Una corrida por rama a la vez; en PRs se cancela la anterior si llega un
# push nuevo. Los push a main nunca se cancelan a mitad de un deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma versión mayor que la base de datos de Railway.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inventory_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      # Solo para CI: el contexto de Spring necesita un valor (>= 32 bytes).
      JWT_SECRET: ci-only-secret-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # contextLoads levanta Spring contra un PostgreSQL real: aplica las
      # migraciones Flyway V1..V6 y valida las entidades (ddl-auto=validate).
      - name: Tests
        run: ./mvnw -B verify

      - name: Validar Dockerfile
        run: docker build -t inventory-backend:ci .

  deploy:
    name: Deploy a Railway
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli@5.70.0

      # Sube el código (respeta .gitignore) y Railway construye el
      # Dockerfile. Railway solo le pasa el tráfico a la versión nueva
      # cuando /actuator/health responde 200; si no, sigue la anterior.
      - name: Desplegar
        run: railway up --ci --service "$RAILWAY_SERVICE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "Backend UP"
              exit 0
            fi
            sleep 10
          done
          echo "El backend no respondió UP en 5 minutos"
          exit 1
