# Entorno local: PostgreSQL + backend. Copia .env.example a .env (nunca
# commitear .env) y completa los valores. El frontend se corre aparte desde
# su propio repositorio con `npm run dev`.
#
# Sin container_name fijos: así no choca con contenedores viejos del
# monorepo (postgres_db, inventory_backend). El backend sigue llegando a la
# BD como postgres_db porque ese es el nombre del servicio en esta red.
services:
  postgres_db:
    # Misma versión mayor que la base de datos de Railway.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, see .env.example}
    ports:
      - "5433:5432"
    volumes:
      - inventory_back_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory_backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres_db:5432/${POSTGRES_DB:-inventory_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, see .env.example}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    ports:
      - "8080:8080"
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  inventory_back_postgres_data:
