<p style="margin:0 0 16px;">Quisiéramos hacerles el siguiente pedido de reposición:</p>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;font-size:14px;margin:0 0 16px;">
  <tr style="border-bottom:1px solid #e5e7eb;">
    <td style="padding:8px 0;color:#6b7280;">Producto</td>
    <td align="right" style="padding:8px 0;font-weight:bold;">{{product}}</td>
  </tr>
  <tr style="border-bottom:1px solid #e5e7eb;">
    <td style="padding:8px 0;color:#6b7280;">Código de barras</td>
    <td align="right" style="padding:8px 0;">{{barcode}}</td>
  </tr>
  <tr style="border-bottom:1px solid #e5e7eb;">
    <td style="padding:8px 0;color:#6b7280;">Cantidad solicitada</td>
    <td align="right" style="padding:8px 0;font-weight:bold;">{{quantity}} unidades</td>
  </tr>
</table>
<p style="margin:0 0 16px;">Por favor confírmenos la disponibilidad, el precio y la fecha de entrega respondiendo a este correo.</p>
<p style="margin:0;">Gracias,<br><strong>{{business}}</strong>{{phoneLine}}</p>
