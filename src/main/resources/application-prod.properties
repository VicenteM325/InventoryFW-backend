# Perfil de producción (Railway: SPRING_PROFILES_ACTIVE=prod). Solo
# sobreescribe lo que cambia respecto de application.properties.

spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO

# La red privada de Railway puede tardar unos segundos en estar lista cuando
# arranca el contenedor: reintentar la primera conexión a PostgreSQL hasta
# 60 s en vez de caerse de inmediato.
spring.datasource.hikari.initialization-fail-timeout=60000
