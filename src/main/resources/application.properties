spring.application.name=inventory_back

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres_db:5432/inventory_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=DEBUG
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

# Regla de negocio del Proceso 1 (BPM): stock mínimo = 2 unidades por modelo.
inventory.stock-minimo=2