spring.application.name=inventory_back

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres_db:5432/inventory_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
# Trazas verbosas solo bajo demanda (SHOW_SQL=true / SECURITY_LOG_LEVEL=DEBUG).
spring.jpa.show-sql=${SHOW_SQL:false}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# El esquema es responsabilidad exclusiva de Flyway (db/migration/V*.sql).
# Hibernate solo valida que las entidades coincidan con lo que Flyway creó;
# nunca genera ni modifica DDL en ningún entorno.
spring.jpa.hibernate.ddl-auto=validate

# Bases de desarrollo que ya tenían el esquema creado por el antiguo
# ddl-auto=update (antes de adoptar Flyway) se marcan como si V1 ya
# estuviera aplicada, en vez de fallar por "tablas que ya existen". En un
# entorno nuevo con una base de datos vacía, Flyway simplemente corre desde
# V1 y este baseline no tiene efecto.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

# Regla de negocio del Proceso 1 (BPM): stock mínimo = 2 unidades por modelo.
inventory.stock-minimo=2

# Límite de tamaño para las imágenes de anverso/reverso del DPI (RF-05).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Cookie de sesión (JWT). SameSite=None solo si el frontend está en otro sitio.
cookie.same-site=${COOKIE_SAME_SITE:Lax}
cookie.secure=${COOKIE_SECURE:true}


# Correo saliente (Mailtrap vía SMTP). Las credenciales se pasan por variables
# de entorno (ver .env.example); nunca se versionan.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente y URL pública del frontend (para los enlaces de los correos).
mail.from=${MAIL_FROM:no-reply@inventoryfw.local}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# Códigos de un solo uso (2FA por correo y recuperación de contraseña).
security.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
security.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
security.reset.ttl-minutes=${RESET_TTL_MINUTES:30}
