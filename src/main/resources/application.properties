spring.application.name=inventory_back

# Railway inyecta el puerto en PORT; en local y en Docker se mantiene 8080.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres_db:5432/inventory_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

# El esquema es responsabilidad exclusiva de Flyway (db/migration/V*.sql).
# Hibernate solo valida que las entidades coincidan con lo que Flyway creó;
# nunca genera ni modifica DDL en ningún entorno.
spring.jpa.hibernate.ddl-auto=validate

# Bases de desarrollo que ya tenían el esquema creado por el antiguo
# ddl-auto=update (antes de adoptar Flyway) se marcan como si V1 ya
# estuviera aplicada, en vez de fallar por "tablas que ya existen". En un
# entorno nuevo con una base de datos vacía, Flyway simplemente corre desde
# V1 y este baseline no tiene efecto.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}

# Orígenes del frontend permitidos por CORS, separados por coma (admite
# comodines, p.ej. https://*.netlify.app). En producción el navegador llega
# por el proxy de Netlify, que reenvía el header Origin del sitio, así que
# CORS_ALLOWED_ORIGINS debe ser la URL exacta de Netlify.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}

# Regla de negocio del Proceso 1 (BPM): stock mínimo = 2 unidades por modelo.
inventory.stock-minimo=2

# Límite de tamaño para las imágenes de anverso/reverso del DPI (RF-05).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Solo se expone /actuator/health (healthcheck de Railway), sin detalles.
management.endpoints.web.exposure.include=health